name: Build and Deploy to AWS

on:
  push:
    branches: [ "main" ]
    paths: ["repo-registration/**"]

jobs:
  build_deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
      IMAGE_TAG: ${{ github.sha }}
      AWS_ACCOUNT_ID: 545009866715
      AWS_REGION: eu-north-1
    
    defaults:
        run:
          working-directory: repo-registration

    steps:
        - uses: actions/checkout@v4

        - name: Build native binary
          run: |
           docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            ghcr.io/graalvm/graalvm-community:25 \
            ./mvnw native:compile -Pnative
        
        - name: Prepare deployment artifact
          run: |
           mkdir -p lambda-package
           cp target/repo-registration lambda-package/repo-registration
           cp bootstrap lambda-package/bootstrap
           cd lambda-package && zip -j function.zip bootstrap repo-registration

        - name: upload deployment artifact to s3
          run: aws s3 cp lambda-package/function.zip s3://repo-status-tracker-1853/lambda/repo-registration-${IMAGE_TAG}.zip
        
        - name: Provision infra
          run: |
            docker run --rm \
            -v "$(pwd)/infra:/workspace" \
            -w /workspace \
            -e AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID} \
            -e AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY} \
            hashicorp/terraform:latest init

            docker run --rm \
            -v "$(pwd)/infra:/workspace" \
            -w /workspace \
            -e AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID} \
            -e AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY} \
            hashicorp/terraform:latest apply -var="image_tag=${IMAGE_TAG}" -auto-approve